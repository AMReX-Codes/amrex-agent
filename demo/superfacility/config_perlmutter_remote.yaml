# Superfacility (SFAPI) config overrides for Perlmutter (remote staging)

# Environment selection
environment: perlmutter

# Local output directory (this host)
output_dir: /tmp/amrex_agent_runs

# Demo overrides (baseline + inputs)
baseline_override: AMReX/Tests/Amr/Advection_AmrCore/Exec
inputs_file_override: inputs

# Remote destination for staged runs
remote_output_dir: /global/cfs/cdirs/$SBATCH_ACCOUNT/$USER/superfacility
remote_staging: true
remote_staging_method: sfapi_client
remote_run_dir: /global/cfs/cdirs/$SBATCH_ACCOUNT/$USER/superfacility/run_test_1
superfacility_account: $SBATCH_ACCOUNT
remote_executable_path: /global/cfs/cdirs/$SBATCH_ACCOUNT/$USER/superfacility/amrex/Tests/Amr/Advection_AmrCore/Exec/main2d.gnu.MPI.CUDA.ex

# Repo path (optional; follows normal priority if unset)
# amrex_repo_path: /path/to/amrex

# Execution
allow_local_run: false
