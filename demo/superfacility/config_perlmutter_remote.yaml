# Superfacility (SFAPI) config overrides for Perlmutter (remote staging)

# Environment selection
environment: perlmutter

# Local output directory (this host)
# output_dir: /tmp/amrex_agent_runs

# Demo overrides (baseline + inputs)
inputs_file_override: inputs

# Remote destination for staged runs
remote_output_dir: /global/cfs/cdirs/amsc014/superfacility/output
remote_staging: true
remote_staging_method: sfapi_client
remote_run_dir: /global/cfs/cdirs/amsc014/superfacility/output/run_test_1
superfacility_account: amsc014
# Remote executable discovery (finds *.ex, prefers CUDA)
remote_executable_template: /global/cfs/cdirs/amsc014/superfacility/{repo_name}/{case_dir}
remote_executable_find: true

# Repo path (optional; follows normal priority if unset)
# amrex_repo_path: /path/to/amrex

# Execution
allow_local_run: false
