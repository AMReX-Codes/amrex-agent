# Superfacility (SFAPI) config overrides for Perlmutter

# Environment selection
environment: perlmutter

# Repo path (update for your Perlmutter workspace)
amrex_repo_path: /global/cfs/cdirs/$PROJECT/$USER/amrex

# Output directory for run artifacts
output_dir: /global/cfs/cdirs/$PROJECT/$USER/superfacility

# Execution
allow_local_run: false
