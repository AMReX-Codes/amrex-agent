# AmSC i2 API Configuration - clean comparison config
llm_provider: amsc-i2
llm_model: claude-sonnet-4-5
embedding_provider: amsc-i2
litellm_base_url: https://api.i2-core.american-science-cloud.org/v1

# Matching CBORG defaults exactly
faiss_semantic_weight: 0.5
faiss_topk: 3
faiss_fallback_to_llm: true
inputs_file_strategy: newest
max_iterations: 3
allow_local_run: true
output_dir: output
