# PNNL AI API Configuration
llm_provider: pnnl

# Database paths: Set environment variable in your bashrc:
# export AMREX_DATABASE_PATH=/global/cfs/cdirs/m4304/enuss/amrex-agent/database
# This overrides the default Perlmutter path

# Repository paths
remora_repo_path: /global/cfs/cdirs/m4304/enuss/REMORA

# Indexing / retrieval
indexing_strategy: simple
faiss_semantic_weight: 0.5
faiss_fallback_to_llm: true
faiss_topk: 3

# Inputs selection
inputs_file_strategy: newest

# Execution
allow_local_run: true
max_iterations: 3

# Output
output_dir: output