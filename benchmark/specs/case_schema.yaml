$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Scaling Benchmark Case Suite"
type: object
additionalProperties: false
required:
  - schema_version
  - suite_id
  - solver
  - cases
properties:
  schema_version:
    type: string
  suite_id:
    type: string
  solver:
    type: string
  cases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - solver
        - case_name
        - case_dir
        - inputs
        - description
        - dimension
        - physics
        - scaling
        - tags
      properties:
        id:
          type: string
          minLength: 3
        solver:
          type: string
          enum:
            - PeleC
            - PeleLMeX
            - ERF
            - REMORA
        case_name:
          type: string
        case_dir:
          type: string
        inputs:
          type: string
        description:
          type: string
        dimension:
          type: integer
          enum: [2, 3]
        physics:
          type: array
          minItems: 1
          items:
            type: string
        scaling:
          type: object
          additionalProperties: false
          required:
            - type
            - sizes
          properties:
            type:
              type: string
              enum: [strong, weak]
            sizes:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  - label
                  - grid
                  - amr_levels
                properties:
                  label:
                    type: string
                  grid:
                    type: string
                  amr_levels:
                    type: integer
                    minimum: 0
                  notes:
                    type: string
                  resources:
                    type: object
                    additionalProperties: false
                    properties:
                      ranks:
                        type: integer
                        minimum: 1
                      nodes:
                        type: integer
                        minimum: 1
                      gpus:
                        type: integer
                        minimum: 0
                      walltime:
                        type: string
        tags:
          type: array
          minItems: 1
          items:
            type: string
        references:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, ready, deprecated]
        run:
          type: object
          additionalProperties: false
          properties:
            command:
              type: string
            working_dir:
              type: string
            env:
              type: object
              additionalProperties:
                type: string
