  - id: "pelelmex_eb_c7_strong"
    solver: "PeleLMeX"
    case_name: "EB-C7"
    case_dir: "Exec/RegTests/EB-C7"
    inputs: "inputs"
    description: "Embedded boundary low-Mach case for geometry-aware scaling."
    dimension: 3
    physics: [embedded_boundary, combustion, low_mach]
    scaling:
      type: "strong"
      sizes:
        - label: "S"
          grid: "192x192x192"
          amr_levels: 1
        - label: "M"
          grid: "256x256x256"
          amr_levels: 1
        - label: "L"
