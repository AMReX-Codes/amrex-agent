schema_version: "1.0"
suite_id: "erf_scaling_v1"
solver: "ERF"
cases:
  - id: "erf_bubble_strong"
    solver: "ERF"
    case_name: "Bubble"
    case_dir: "Exec/RegTests/Bubble"
    inputs: "inputs"
    description: "Thermal bubble rise for atmospheric dynamics scaling."
    dimension: 3
    physics: [buoyancy, stratification, atmosphere]
    scaling:
      type: "strong"
      sizes:
        - label: "S"
          grid: "128x128x128"
          amr_levels: 0
        - label: "M"
          grid: "256x256x256"
          amr_levels: 0
        - label: "L"
          grid: "384x384x384"
          amr_levels: 0
    tags: [regtest, atmosphere]
    status: "ready"

  - id: "erf_density_current_strong"
    solver: "ERF"
